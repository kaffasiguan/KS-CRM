<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咖啡習慣 KAFFA SIGUAN 日報表</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'k-gray': '#3A3D40',     // 鐵灰
                        'k-light': '#F5F6F8',    // 淺灰/白
                        'k-gold': '#D4AF37',     // 品牌金
                        'k-mint': '#48C9B0',     // 薄荷綠
                        'k-mint-dark': '#148F77',// 深薄荷綠 (選中)
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #F5F6F8; }
        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b5952f; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (System Injected)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Dummy config for fallback if not injected properly
            apiKey: "dummy", authDomain: "dummy", projectId: "dummy", storageBucket: "dummy", messagingSenderId: "dummy", appId: "dummy"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kaffa-siguan-app';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseTools = { auth, db, appId, signInAnonymously, signInWithCustomToken, onAuthStateChanged, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc, writeBatch };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- UI Components ---
        const Icon = ({ name, className = "w-6 h-6" }) => {
            const icons = {
                home: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />,
                search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
                coffee: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-4h1c1.1 0 2-.9 2-2s-.9-2-2-2zm-5 8H3V6h12v10zm5-4h-3V10h3v2z" />,
                settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
                plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />,
                arrowLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />,
                arrowRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" />,
                check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />,
                download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
                upload: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            };
            return (
                <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {icons[name] || icons.home}
                </svg>
            );
        };

        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            const bg = type === 'success' ? 'bg-k-mint-dark' : 'bg-red-500';
            return (
                <div className={`fixed bottom-4 right-4 ${bg} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2 z-50 animate-bounce`}>
                    <Icon name="check" className="w-5 h-5" />
                    <span>{message}</span>
                </div>
            );
        };

        const SimpleBarChart = ({ data, labels, title }) => {
            const maxVal = Math.max(...data, 1);
            return (
                <div className="bg-white p-4 rounded-xl shadow border border-gray-200">
                    <h3 className="text-k-gray font-bold mb-4">{title}</h3>
                    <div className="flex items-end gap-2 h-48 mt-2">
                        {data.map((val, idx) => (
                            <div key={idx} className="flex-1 flex flex-col items-center group relative">
                                <div className="absolute -top-8 bg-k-gray text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity">
                                    ${val.toLocaleString()}
                                </div>
                                <div 
                                    className="w-full bg-k-gold rounded-t-sm transition-all duration-500"
                                    style={{ height: `${(val / maxVal) * 100}%`, minHeight: '4px' }}
                                ></div>
                                <div className="text-xs text-gray-500 mt-2 truncate w-full text-center">{labels[idx]}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            // Firebase State
            const [user, setUser] = useState(null);
            const [fb, setFb] = useState(null);
            
            // Data State
            const [transactions, setTransactions] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [expenses, setExpenses] = useState([]);
            
            // UI State
            const [lang, setLang] = useState('zh-TW');
            const [activeMenu, setActiveMenu] = useState('entry'); // entry, history, items, backend
            const [activeEntryTab, setActiveEntryTab] = useState('vip'); // vip, general
            const [activeBackendTab, setActiveBackendTab] = useState('finance'); // finance, analysis, linepay, expense, backup
            const [toast, setToast] = useState(null);
            const [now, setNow] = useState(new Date());

            // --- Translations (Simplified) ---
            const t = {
                'zh-TW': {
                    menu: ['登錄消費', '消費查詢', '銷售品項', '管理後台'],
                    tabs: ['核心客群', '一般客群'],
                    backendTabs: ['財報分析', '顧客分析', 'Line Pay 請款', '店務記帳', '系統備份']
                },
                'en': {
                    menu: ['Entry', 'History', 'Items', 'Backend'],
                    tabs: ['VIP', 'General'],
                    backendTabs: ['Finance', 'Analysis', 'Line Pay', 'Expenses', 'Backup']
                },
                'ja': {
                    menu: ['登録', '履歴', '商品', '管理'],
                    tabs: ['VIP', '一般'],
                    backendTabs: ['財務', '分析', 'Line Pay', '経費', 'バックアップ']
                },
                'ko': {
                    menu: ['등록', '내역', '상품', '관리'],
                    tabs: ['VIP', '일반'],
                    backendTabs: ['재무', '분석', 'Line Pay', '비용', '백업']
                },
                'de': {
                    menu: ['Eintrag', 'Verlauf', 'Artikel', 'Backend'],
                    tabs: ['VIP', 'Allgemein'],
                    backendTabs: ['Finanzen', 'Analyse', 'Line Pay', 'Ausgaben', 'Backup']
                }
            };

            // Clock Effect
            useEffect(() => {
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const formatDateTime = (date) => {
                const d = new Date(date);
                const days = ['日', '一', '二', '三', '四', '五', '六'];
                return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}（星期${days[d.getDay()]}）${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
            };

            // Initialize Firebase
            useEffect(() => {
                if (!window.firebaseTools) return;
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.firebaseTools;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Auth error:", e);
                    }
                };
                initAuth();
                
                const unsub = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setFb(window.firebaseTools);
                });
                return () => unsub();
            }, []);

            // Fetch Data
            useEffect(() => {
                if (!user || !fb) return;
                const { db, appId, collection, onSnapshot } = fb;
                const getRef = (colName) => collection(db, 'artifacts', appId, 'users', user.uid, colName);

                const unsubTx = onSnapshot(getRef('transactions'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setTransactions(data.sort((a,b) => b.timestamp - a.timestamp));
                }, (err) => console.error(err));

                const unsubCus = onSnapshot(getRef('customers'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    // If empty, init dummy data for preview
                    if (data.length === 0) {
                        initDummyCustomers();
                    } else {
                        setCustomers(data);
                    }
                }, (err) => console.error(err));

                const unsubExp = onSnapshot(getRef('expenses'), (snap) => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setExpenses(data.sort((a,b) => b.timestamp - a.timestamp));
                }, (err) => console.error(err));

                return () => { unsubTx(); unsubCus(); unsubExp(); };
            }, [user, fb]);

            const initDummyCustomers = async () => {
                if (!fb || !user) return;
                const { db, appId, collection, addDoc } = fb;
                const ref = collection(db, 'artifacts', appId, 'users', user.uid, 'customers');
                const dummies = [
                    { type: 'vip', name: '李', balance: 1200, cups: 0, orderIndex: 0 },
                    { type: 'vip', name: '婆', balance: 500, cups: 0, orderIndex: 1 },
                    { type: 'vip', name: '白', balance: 0, cups: 0, orderIndex: 2 },
                    { type: 'general', name: '勁戰小姐', balance: 0, cups: 3, orderIndex: 0 },
                    { type: 'general', name: '小鬍子', balance: 0, cups: 0, orderIndex: 1 },
                    { type: 'general', name: 'TIFFINY', balance: 0, cups: 5, orderIndex: 2 },
                    { type: 'general', name: 'FOLOLLI', balance: 0, cups: 0, orderIndex: 3 },
                    { type: 'general', name: '華僑先生', balance: 0, cups: 1, orderIndex: 4 },
                ];
                for (const d of dummies) {
                    await addDoc(ref, d);
                }
            };

            const showToast = (msg) => {
                setToast(msg);
            };

            // --- Sub-components ---

            const Sidebar = () => (
                <div className="w-1/6 bg-k-gray h-screen flex flex-col justify-between p-4 text-white shrink-0">
                    <div>
                        <div className="flex justify-center mb-8">
                            <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center p-2 relative overflow-hidden ring-2 ring-k-gold">
                                <img 
                                    src="金色logo.png" 
                                    alt="Logo" 
                                    className="w-full h-full object-contain"
                                    onError={(e) => {
                                        e.target.onerror = null;
                                        // Fallback SVG Gold Bean/Cup
                                        e.target.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23D4AF37"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm1-13h-2v4H8v2h3v4h2v-4h3V9h-3V7z"/></svg>';
                                    }}
                                />
                            </div>
                        </div>
                        <div className="space-y-4">
                            {[
                                { id: 'entry', icon: 'home', label: t[lang].menu[0] },
                                { id: 'history', icon: 'search', label: t[lang].menu[1] },
                                { id: 'items', icon: 'coffee', label: t[lang].menu[2] },
                                { id: 'backend', icon: 'settings', label: t[lang].menu[3] }
                            ].map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveMenu(item.id)}
                                    className={`w-full flex items-center gap-3 p-4 rounded-xl transition-all duration-300 font-bold text-lg
                                        ${activeMenu === item.id 
                                            ? 'bg-k-mint-dark text-white ring-2 ring-k-gold shadow-lg transform scale-105' 
                                            : 'bg-k-mint text-white hover:bg-opacity-80'}`}
                                >
                                    <Icon name={item.icon} />
                                    {item.label}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {/* Language Switcher */}
                    <div className="grid grid-cols-2 gap-2 mt-auto pt-8">
                        {['zh-TW', 'en', 'ja', 'ko', 'de'].map(l => (
                            <button 
                                key={l}
                                onClick={() => setLang(l)}
                                className={`py-2 text-sm rounded ${lang === l ? 'bg-k-gold text-k-gray font-bold' : 'bg-gray-600 text-gray-300 hover:bg-gray-500'}`}
                            >
                                {l === 'zh-TW' ? '繁中' : l === 'en' ? 'EN' : l === 'ja' ? '日本語' : l === 'ko' ? '한국어' : 'DE'}
                            </button>
                        ))}
                    </div>
                </div>
            );

            const Header = () => (
                <div className="h-1/5 max-h-[120px] flex items-center justify-between px-8 bg-white border-b border-gray-200">
                    <div className="flex items-center gap-4">
                         <div className="w-12 h-12 bg-k-gray rounded-full flex items-center justify-center ring-2 ring-k-gold">
                            <Icon name="coffee" className="w-6 h-6 text-k-gold" />
                        </div>
                        <h1 className="text-k-gold text-3xl font-bold tracking-wider">咖啡習慣 KAFFA SIGUAN 日報表</h1>
                    </div>
                    <div className="text-k-gray font-mono text-xl font-bold bg-k-light px-4 py-2 rounded-lg border border-gray-300">
                        {formatDateTime(now)}
                    </div>
                </div>
            );

            // --- Entry Forms ---
            const EntryArea = () => {
                return (
                    <div className="h-[calc(100vh-120px)] flex flex-col p-6 overflow-hidden">
                        {/* Tabs */}
                        <div className="flex gap-4 mb-6">
                            {[
                                { id: 'vip', label: t[lang].tabs[0] },
                                { id: 'general', label: t[lang].tabs[1] }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveEntryTab(tab.id)}
                                    className={`flex-1 py-4 text-2xl font-bold rounded-t-2xl transition-colors
                                        ${activeEntryTab === tab.id 
                                            ? 'bg-k-mint-dark text-white border-b-4 border-k-gold shadow-md' 
                                            : 'bg-white text-gray-500 border-b-2 border-transparent hover:bg-gray-50'}`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                        
                        {/* Form Content */}
                        <div className="flex-1 bg-white rounded-b-2xl rounded-tr-2xl shadow-sm border border-gray-200 p-6 relative overflow-y-auto hide-scrollbar">
                            {activeEntryTab === 'vip' ? <VipForm /> : <GeneralForm />}
                        </div>
                    </div>
                );
            };

            const VipForm = () => {
                const vips = customers.filter(c => c.type === 'vip').sort((a,b) => a.orderIndex - b.orderIndex);
                const [selCus, setSelCus] = useState(null);
                const [selPay, setSelPay] = useState('');
                const [amount, setAmount] = useState(100); // Quick default
                const [showAdd, setShowAdd] = useState(false);
                const [newName, setNewName] = useState('');

                const handleSubmit = async () => {
                    if (!selCus || !selPay || !amount) return showToast("請完整選擇！");
                    
                    const tx = {
                        timestamp: Date.now(),
                        customerId: selCus.id,
                        customerName: selCus.name,
                        customerType: 'vip',
                        item: '客製飲品', // VIP default
                        temp: '-',
                        paymentMethod: selPay,
                        amount: Number(amount),
                        settlementDate: ''
                    };

                    try {
                        const { db, appId, collection, addDoc, doc, updateDoc } = fb;
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'transactions'), tx);
                        
                        // Deduct balance if using store value
                        if (selPay === '儲值扣款' && selCus.balance >= amount) {
                            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'customers', selCus.id), {
                                balance: selCus.balance - amount
                            });
                        }
                        
                        showToast(`已登錄：${selCus.name} - $${amount}`);
                        setSelCus(null); setSelPay(''); setAmount(100);
                    } catch(e) { console.error(e); showToast("錯誤！"); }
                };

                const handleAddVip = async () => {
                    if(!newName) return;
                    const { db, appId, collection, addDoc } = fb;
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'customers'), {
                        type: 'vip', name: newName, balance: 0, cups: 0, orderIndex: vips.length
                    });
                    setShowAdd(false); setNewName('');
                };

                return (
                    <div className="flex flex-col h-full space-y-8">
                        {/* Field 1: Time (Readonly) */}
                        <div>
                            <label className="block text-k-gray font-bold mb-2 text-lg">1. 來店時間</label>
                            <input type="text" readOnly value={formatDateTime(now)} className="w-full bg-k-light border border-gray-300 rounded-lg p-4 text-gray-600 font-mono text-lg" />
                        </div>
                        
                        {/* Field 2: Name */}
                        <div>
                            <label className="block text-k-gray font-bold mb-2 text-lg">2. 姓名 (選擇核心客群)</label>
                            <div className="flex flex-wrap gap-4">
                                {vips.map(v => (
                                    <button 
                                        key={v.id}
                                        onClick={() => setSelCus(v)}
                                        className={`px-8 py-4 rounded-xl text-xl font-bold transition-all
                                            ${selCus?.id === v.id ? 'bg-k-mint-dark text-white ring-4 ring-k-gold' : 'bg-k-mint text-white hover:bg-opacity-80'}`}
                                    >
                                        {v.name}
                                    </button>
                                ))}
                                <button onClick={() => setShowAdd(true)} className="px-6 py-4 rounded-xl bg-gray-200 text-k-gray hover:bg-gray-300 flex items-center justify-center">
                                    <Icon name="plus" />
                                </button>
                            </div>
                        </div>

                        {/* Temp Amount Field for VIP */}
                        <div>
                            <label className="block text-k-gray font-bold mb-2 text-lg">金額 (快速結帳)</label>
                            <input 
                                type="number" value={amount} onChange={e=>setAmount(e.target.value)}
                                className="w-48 bg-white border-2 border-k-mint rounded-lg p-4 text-2xl font-bold text-center"
                            />
                        </div>

                        {/* Field 3: Payment */}
                        <div>
                            <label className="block text-k-gray font-bold mb-2 text-lg">3. 付款方式</label>
                            <div className="flex gap-4">
                                {['現金', 'Line Pay', '儲值扣款'].map(p => {
                                    const isStoreVal = p === '儲值扣款';
                                    const disableStoreVal = isStoreVal && selCus && selCus.balance < amount;
                                    
                                    return (
                                        <button 
                                            key={p}
                                            disabled={disableStoreVal}
                                            onClick={() => setSelPay(p)}
                                            className={`flex-1 py-6 rounded-2xl text-2xl font-bold transition-all relative flex flex-col items-center justify-center
                                                ${selPay === p ? 'bg-k-mint-dark text-white ring-4 ring-k-gold' : 'bg-k-mint text-white hover:bg-opacity-90'}
                                                ${disableStoreVal ? 'opacity-50 cursor-not-allowed bg-gray-400' : ''}`}
                                        >
                                            {p}
                                            {isStoreVal && selCus && (
                                                <span className="text-k-gold font-bold text-sm mt-1 bg-k-gray px-2 py-0.5 rounded">
                                                    (餘額: ${selCus.balance})
                                                </span>
                                            )}
                                        </button>
                                    )
                                })}
                            </div>
                        </div>

                        {/* Field 4: Submit */}
                        <div className="mt-auto flex justify-end pt-8">
                            <button 
                                onClick={handleSubmit}
                                className="bg-k-gold text-white px-12 py-6 rounded-2xl text-3xl font-bold shadow-xl hover:bg-yellow-600 transition-all transform hover:scale-105"
                            >
                                確認登錄
                            </button>
                        </div>

                        {/* Add Modal */}
                        {showAdd && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className="bg-white p-8 rounded-2xl w-96">
                                    <h3 className="text-2xl font-bold mb-4 text-k-gray">新增核心客群</h3>
                                    <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)} placeholder="輸入姓名" className="w-full border-2 border-gray-300 p-3 rounded-lg mb-4 text-xl" />
                                    <div className="flex gap-4">
                                        <button onClick={()=>setShowAdd(false)} className="flex-1 py-3 bg-gray-300 rounded-lg text-lg font-bold">取消</button>
                                        <button onClick={handleAddVip} className="flex-1 py-3 bg-k-mint text-white rounded-lg text-lg font-bold">新增</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const GeneralForm = () => {
                const gens = customers.filter(c => c.type === 'general').sort((a,b) => a.orderIndex - b.orderIndex);
                const [selCus, setSelCus] = useState(null);
                const [selItem, setSelItem] = useState('');
                const [selTemp, setSelTemp] = useState('');
                const [selPay, setSelPay] = useState('');
                const [sortMode, setSortMode] = useState(false);
                const [showAdd, setShowAdd] = useState(false);
                const [newName, setNewName] = useState('');

                const items = { '美式': 80, '拿鐵': 120, '西西里': 130 };
                const amount = selItem ? items[selItem] : 0;

                const handleMove = async (index, direction) => {
                    if (direction === -1 && index === 0) return;
                    if (direction === 1 && index === gens.length - 1) return;
                    
                    const newGens = [...gens];
                    const temp = newGens[index];
                    newGens[index] = newGens[index + direction];
                    newGens[index + direction] = temp;

                    // Batch update Firestore
                    const { db, appId, doc, writeBatch } = fb;
                    const batch = writeBatch(db);
                    newGens.forEach((g, i) => {
                        batch.update(doc(db, 'artifacts', appId, 'users', user.uid, 'customers', g.id), { orderIndex: i });
                    });
                    await batch.commit();
                };

                const handleSubmit = async () => {
                    if (!selCus || !selItem || !selTemp || !selPay) return showToast("請完整選擇！");
                    
                    const tx = {
                        timestamp: Date.now(),
                        customerId: selCus.id,
                        customerName: selCus.name,
                        customerType: 'general',
                        item: selItem,
                        temp: selTemp,
                        paymentMethod: selPay,
                        amount: amount,
                        settlementDate: ''
                    };

                    try {
                        const { db, appId, collection, addDoc, doc, updateDoc } = fb;
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'transactions'), tx);
                        
                        if (selPay === '寄杯' && selCus.cups > 0) {
                            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'customers', selCus.id), {
                                cups: selCus.cups - 1
                            });
                        }
                        
                        showToast(`已登錄：${selCus.name} - ${selItem}`);
                        setSelCus(null); setSelItem(''); setSelTemp(''); setSelPay('');
                    } catch(e) { console.error(e); }
                };

                const handleAdd = async () => {
                    if(!newName) return;
                    const { db, appId, collection, addDoc } = fb;
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'customers'), {
                        type: 'general', name: newName, balance: 0, cups: 0, orderIndex: gens.length
                    });
                    setShowAdd(false); setNewName('');
                };

                return (
                    <div className="flex flex-col h-full space-y-6">
                        {/* Row 1: Time & Sort Toggle */}
                        <div className="flex justify-between items-end">
                            <div className="flex-1 mr-8">
                                <label className="block text-k-gray font-bold mb-2 text-lg">1. 來店時間</label>
                                <input type="text" readOnly value={formatDateTime(now)} className="w-full bg-k-light border border-gray-300 rounded-lg p-3 text-gray-600 font-mono" />
                            </div>
                            <button 
                                onClick={() => setSortMode(!sortMode)}
                                className={`px-6 py-3 rounded-lg font-bold border-2 transition-colors ${sortMode ? 'bg-k-gold text-white border-k-gold' : 'bg-white text-k-gray border-gray-300'}`}
                            >
                                {sortMode ? '完成排序' : '調整順序'}
                            </button>
                        </div>

                        {/* Field 2: Customers Grid */}
                        <div>
                            <label className="block text-k-gray font-bold mb-2 text-lg">2. 代號 (選擇一般客群)</label>
                            <div className="grid grid-cols-5 gap-3">
                                {gens.map((g, idx) => (
                                    <div key={g.id} className="relative group">
                                        <button 
                                            onClick={() => !sortMode && setSelCus(g)}
                                            className={`w-full py-4 rounded-xl text-lg font-bold transition-all h-full
                                                ${selCus?.id === g.id ? 'bg-k-mint-dark text-white ring-4 ring-k-gold' : 'bg-k-mint text-white'}
                                                ${sortMode ? 'cursor-move opacity-90' : 'hover:bg-opacity-80'}`}
                                        >
                                            {g.name}
                                        </button>
                                        {sortMode && (
                                            <div className="absolute -bottom-3 left-1/2 -translate-x-1/2 flex gap-1 bg-white p-1 rounded-full shadow-lg border border-gray-200">
                                                <button onClick={()=>handleMove(idx, -1)} className="p-1 hover:text-k-mint"><Icon name="arrowLeft" className="w-4 h-4"/></button>
                                                <button onClick={()=>handleMove(idx, 1)} className="p-1 hover:text-k-mint"><Icon name="arrowRight" className="w-4 h-4"/></button>
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {!sortMode && (
                                    <button onClick={() => setShowAdd(true)} className="py-4 rounded-xl bg-gray-200 text-k-gray hover:bg-gray-300 flex items-center justify-center">
                                        <Icon name="plus" />
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Layout Split for Item/Temp/Pay */}
                        <div className="grid grid-cols-2 gap-8">
                            {/* Left: Item & Temp */}
                            <div className="space-y-6">
                                <div>
                                    <label className="flex justify-between text-k-gray font-bold mb-2 text-lg">
                                        <span>3. 品項</span>
                                        {amount > 0 && <span className="text-k-gold text-2xl font-black">${amount}</span>}
                                    </label>
                                    <div className="grid grid-cols-3 gap-2">
                                        {Object.keys(items).map(i => (
                                            <button 
                                                key={i} onClick={() => setSelItem(i)}
                                                className={`py-3 rounded-xl text-lg font-bold transition-all ${selItem === i ? 'bg-k-mint-dark text-white ring-2 ring-k-gold' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                                            >
                                                {i}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-k-gray font-bold mb-2 text-lg">4. 溫度</label>
                                    <div className="flex gap-2">
                                        {['冰', '熱', '溫'].map(t => (
                                            <button 
                                                key={t} onClick={() => setSelTemp(t)}
                                                className={`flex-1 py-3 rounded-xl text-lg font-bold transition-all ${selTemp === t ? 'bg-k-mint-dark text-white ring-2 ring-k-gold' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                                            >
                                                {t}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Right: Payment & Submit */}
                            <div className="space-y-6 flex flex-col">
                                <div>
                                    <label className="block text-k-gray font-bold mb-2 text-lg">5. 付款方式</label>
                                    <div className="flex flex-col gap-3">
                                        {['現金', 'Line Pay', '寄杯'].map(p => {
                                            const isCup = p === '寄杯';
                                            const disableCup = isCup && selCus && selCus.cups <= 0;
                                            return (
                                                <button 
                                                    key={p} disabled={disableCup} onClick={() => setSelPay(p)}
                                                    className={`py-4 rounded-xl text-xl font-bold flex justify-between px-6 items-center transition-all
                                                        ${selPay === p ? 'bg-k-mint-dark text-white ring-2 ring-k-gold' : 'bg-k-mint text-white hover:bg-opacity-90'}
                                                        ${disableCup ? 'opacity-50 cursor-not-allowed bg-gray-400' : ''}`}
                                                >
                                                    <span>{p}</span>
                                                    {isCup && selCus && (
                                                        <span className="text-k-gold bg-k-gray px-3 py-1 rounded-lg text-sm">剩餘: {selCus.cups} 杯</span>
                                                    )}
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                                <div className="mt-auto pt-4">
                                     <button 
                                        onClick={handleSubmit}
                                        className="w-full bg-k-gold text-white py-5 rounded-2xl text-2xl font-bold shadow-lg hover:bg-yellow-600 transition-all transform hover:scale-105"
                                    >
                                        確認登錄
                                    </button>
                                </div>
                            </div>
                        </div>

                         {/* Add Modal */}
                         {showAdd && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className="bg-white p-8 rounded-2xl w-96">
                                    <h3 className="text-2xl font-bold mb-4 text-k-gray">新增一般客群</h3>
                                    <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)} placeholder="輸入代號名稱" className="w-full border-2 border-gray-300 p-3 rounded-lg mb-4 text-xl" />
                                    <div className="flex gap-4">
                                        <button onClick={()=>setShowAdd(false)} className="flex-1 py-3 bg-gray-300 rounded-lg text-lg font-bold">取消</button>
                                        <button onClick={handleAdd} className="flex-1 py-3 bg-k-mint text-white rounded-lg text-lg font-bold">新增</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // --- Backend Components ---
            const BackendArea = () => {
                const tabs = [
                    { id: 'finance', label: t[lang].backendTabs[0] },
                    { id: 'analysis', label: t[lang].backendTabs[1] },
                    { id: 'linepay', label: t[lang].backendTabs[2] },
                    { id: 'expense', label: t[lang].backendTabs[3] },
                    { id: 'backup', label: t[lang].backendTabs[4] }
                ];

                return (
                    <div className="h-[calc(100vh-120px)] flex flex-col p-6 overflow-hidden">
                        {/* Header Tabs */}
                        <div className="flex gap-2 mb-6">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveBackendTab(tab.id)}
                                    className={`flex-1 py-3 text-lg font-bold rounded-xl transition-all
                                        ${activeBackendTab === tab.id ? 'bg-k-gray text-white shadow-md transform scale-105' : 'bg-white text-k-gray border border-gray-200 hover:bg-gray-50'}`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                        
                        {/* Content Area */}
                        <div className="flex-1 bg-white rounded-2xl shadow-sm border border-gray-200 p-6 overflow-y-auto hide-scrollbar">
                            {activeBackendTab === 'finance' && <BackendFinance tx={transactions} exp={expenses} />}
                            {activeBackendTab === 'analysis' && <BackendAnalysis tx={transactions} customers={customers} />}
                            {activeBackendTab === 'linepay' && <BackendLinePay tx={transactions} />}
                            {activeBackendTab === 'expense' && <BackendExpense />}
                            {activeBackendTab === 'backup' && <BackendBackup />}
                        </div>
                    </div>
                );
            };

            const BackendFinance = ({ tx, exp }) => {
                const [filter, setFilter] = useState('today'); // today, week, month, custom
                const [dateRange, setDateRange] = useState({ start: '', end: '' });

                const filteredTx = useMemo(() => {
                    const now = new Date();
                    return tx.filter(t => {
                        const d = new Date(t.timestamp);
                        if (filter === 'today') return d.toDateString() === now.toDateString();
                        if (filter === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                        if (filter === 'custom' && dateRange.start && dateRange.end) {
                            return d >= new Date(dateRange.start) && d <= new Date(dateRange.end + 'T23:59:59');
                        }
                        return true; // week logic simplified for brevity
                    });
                }, [tx, filter, dateRange]);

                const filteredExp = useMemo(() => {
                    const now = new Date();
                    return exp.filter(e => {
                        const d = new Date(e.timestamp);
                        if (filter === 'today') return d.toDateString() === now.toDateString();
                        if (filter === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                        return true;
                    });
                }, [exp, filter]);

                const revenue = filteredTx.reduce((sum, t) => sum + (Number(t.amount)||0), 0);
                const totalExp = filteredExp.reduce((sum, e) => sum + (Number(e.amount)||0), 0);
                const netProfit = revenue - totalExp;

                const payStats = filteredTx.reduce((acc, t) => {
                    acc[t.paymentMethod] = (acc[t.paymentMethod] || 0) + (Number(t.amount)||0);
                    return acc;
                }, {});

                return (
                    <div className="space-y-6">
                        {/* Filters */}
                        <div className="flex gap-4 items-center">
                            {['today', 'month', 'custom'].map(f => (
                                <button key={f} onClick={()=>setFilter(f)} className={`px-4 py-2 rounded-lg font-bold ${filter === f ? 'bg-k-mint text-white' : 'bg-gray-100 text-gray-600'}`}>
                                    {f === 'today' ? '今日' : f === 'month' ? '本月' : '自訂期間'}
                                </button>
                            ))}
                            {filter === 'custom' && (
                                <div className="flex gap-2 items-center text-sm">
                                    <input type="date" className="border p-2 rounded" onChange={e=>setDateRange(p=>({...p, start: e.target.value}))}/>
                                    <span>~</span>
                                    <input type="date" className="border p-2 rounded" onChange={e=>setDateRange(p=>({...p, end: e.target.value}))}/>
                                </div>
                            )}
                        </div>

                        {/* KPI Cards */}
                        <div className="grid grid-cols-3 gap-6">
                            <div className="bg-k-gray p-6 rounded-2xl text-white shadow">
                                <div className="text-gray-400 text-sm mb-1">總營業額</div>
                                <div className="text-4xl font-black text-k-gold">${revenue.toLocaleString()}</div>
                            </div>
                            <div className="bg-white border-2 border-gray-200 p-6 rounded-2xl text-k-gray shadow">
                                <div className="text-gray-500 text-sm mb-1">總支出</div>
                                <div className="text-4xl font-black">${totalExp.toLocaleString()}</div>
                            </div>
                            <div className={`p-6 rounded-2xl text-white shadow ${netProfit >= 0 ? 'bg-k-mint-dark' : 'bg-red-500'}`}>
                                <div className="text-white/80 text-sm mb-1">淨利潤</div>
                                <div className="text-4xl font-black">${netProfit.toLocaleString()}</div>
                            </div>
                        </div>

                        {/* Charts / Details */}
                        <div className="grid grid-cols-2 gap-6">
                             <SimpleBarChart 
                                title="收款管道分析"
                                data={[payStats['現金']||0, payStats['Line Pay']||0, payStats['儲值扣款']||0]}
                                labels={['現金', 'Line Pay', '儲值扣款']}
                             />
                             <div className="bg-white p-4 rounded-xl shadow border border-gray-200">
                                <h3 className="text-k-gray font-bold mb-4 border-b pb-2">明細總覽</h3>
                                <div className="space-y-3 text-lg">
                                    <div className="flex justify-between"><span>現金總額：</span><span className="font-bold">${(payStats['現金']||0).toLocaleString()}</span></div>
                                    <div className="flex justify-between"><span>Line Pay：</span><span className="font-bold">${(payStats['Line Pay']||0).toLocaleString()}</span></div>
                                    <div className="flex justify-between"><span>儲值扣除：</span><span className="font-bold text-k-gold">${(payStats['儲值扣款']||0).toLocaleString()}</span></div>
                                </div>
                             </div>
                        </div>
                    </div>
                );
            };

            const BackendAnalysis = ({ tx, customers }) => {
                const [selCusId, setSelCusId] = useState(null);
                
                const cusHistory = tx.filter(t => t.customerId === selCusId).sort((a,b) => b.timestamp - a.timestamp);

                return (
                    <div className="flex gap-6 h-full">
                        {/* Left: Customer List */}
                        <div className="w-1/3 border-r border-gray-200 pr-4 overflow-y-auto hide-scrollbar space-y-2">
                            <h3 className="font-bold text-k-gray mb-4 sticky top-0 bg-white py-2">點擊顧客檢視歷史</h3>
                            {customers.sort((a,b) => a.type.localeCompare(b.type)).map(c => (
                                <button 
                                    key={c.id} onClick={() => setSelCusId(c.id)}
                                    className={`w-full text-left p-4 rounded-xl font-bold text-lg transition-all flex justify-between items-center
                                        ${selCusId === c.id ? 'bg-k-mint-dark text-white shadow-md' : 'bg-gray-100 text-k-gray hover:bg-gray-200'}`}
                                >
                                    <span>{c.name}</span>
                                    <span className="text-xs bg-black/10 px-2 py-1 rounded">{c.type==='vip'?'核心':'一般'}</span>
                                </button>
                            ))}
                        </div>
                        
                        {/* Right: History */}
                        <div className="w-2/3 pl-2 overflow-y-auto hide-scrollbar">
                            {!selCusId ? (
                                <div className="h-full flex items-center justify-center text-gray-400 text-xl font-bold">請由左側選擇顧客</div>
                            ) : (
                                <div className="space-y-3">
                                    <h3 className="font-bold text-2xl text-k-gold mb-4 sticky top-0 bg-white py-2 border-b">
                                        {customers.find(c=>c.id===selCusId)?.name} 的消費紀錄
                                    </h3>
                                    {cusHistory.length === 0 ? <p className="text-gray-500">尚無紀錄</p> : cusHistory.map(t => (
                                        <div key={t.id} className="bg-k-light p-4 rounded-xl border border-gray-200 flex justify-between items-center hover:shadow transition-shadow">
                                            <div>
                                                <div className="text-sm text-gray-500 font-mono mb-1">{formatDateTime(t.timestamp).split('（')[0]} {formatDateTime(t.timestamp).split('）')[1]}</div>
                                                <div className="font-bold text-lg text-k-gray">
                                                    {t.item} / {t.temp} / {t.paymentMethod}
                                                </div>
                                            </div>
                                            <div className="text-2xl font-black text-k-gold">${t.amount}</div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const BackendLinePay = ({ tx }) => {
                const linePays = tx.filter(t => t.paymentMethod === 'Line Pay').sort((a,b) => b.timestamp - a.timestamp);
                
                const handleUpdateDate = async (id, dateStr) => {
                    const { db, appId, doc, updateDoc } = fb;
                    await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'transactions', id), {
                        settlementDate: dateStr
                    });
                    showToast("撥款日期已更新！");
                };

                return (
                    <div>
                        <h3 className="text-2xl font-bold text-k-gray mb-6">Line Pay 對帳專區</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-k-gray text-white">
                                        <th className="p-4 rounded-tl-xl">交易時間</th>
                                        <th className="p-4">顧客姓名</th>
                                        <th className="p-4">金額</th>
                                        <th className="p-4 rounded-tr-xl">【款項撥款日期】</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {linePays.map((t, idx) => (
                                        <tr key={t.id} className={`border-b ${idx%2===0?'bg-white':'bg-gray-50'} hover:bg-gray-100`}>
                                            <td className="p-4 font-mono text-sm">{new Date(t.timestamp).toLocaleString()}</td>
                                            <td className="p-4 font-bold">{t.customerName}</td>
                                            <td className="p-4 font-bold text-k-gold text-lg">${t.amount}</td>
                                            <td className="p-4">
                                                <input 
                                                    type="date" 
                                                    value={t.settlementDate || ''}
                                                    onChange={(e) => handleUpdateDate(t.id, e.target.value)}
                                                    className={`border p-2 rounded-lg font-mono ${t.settlementDate ? 'bg-k-mint/20 border-k-mint text-k-mint-dark font-bold' : 'bg-white border-gray-300'}`}
                                                />
                                            </td>
                                        </tr>
                                    ))}
                                    {linePays.length === 0 && <tr><td colSpan="4" className="p-8 text-center text-gray-500">無 Line Pay 交易紀錄</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const BackendExpense = () => {
                const [amount, setAmount] = useState('');
                const [cat, setCat] = useState('');
                const [note, setNote] = useState('');

                const cats = ['咖啡生豆/採購', '水費', '電費', '店租', '雜項開銷'];

                const handleSubmit = async () => {
                    if(!amount || !cat) return showToast("請輸入金額與類別！");
                    const { db, appId, collection, addDoc } = fb;
                    await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'expenses'), {
                        timestamp: Date.now(),
                        amount: Number(amount),
                        category: cat,
                        note: note
                    });
                    showToast("支出登錄成功！");
                    setAmount(''); setCat(''); setNote('');
                };

                return (
                    <div className="max-w-2xl mx-auto space-y-6 pt-8">
                        <h3 className="text-2xl font-bold text-k-gray mb-6 text-center border-b pb-4">店務開銷帳本</h3>
                        
                        <div>
                            <label className="block text-k-gray font-bold mb-2">支出金額</label>
                            <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} className="w-full text-3xl font-black text-red-500 p-4 border-2 border-gray-300 rounded-xl bg-k-light focus:border-red-500 focus:outline-none" placeholder="$ 0" />
                        </div>

                        <div>
                            <label className="block text-k-gray font-bold mb-2">費用類別</label>
                            <div className="flex flex-wrap gap-3">
                                {cats.map(c => (
                                    <button 
                                        key={c} onClick={()=>setCat(c)}
                                        className={`px-6 py-3 rounded-xl font-bold text-lg transition-all
                                            ${cat === c ? 'bg-k-gray text-k-gold ring-2 ring-k-gold' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}
                                    >
                                        {c}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div>
                            <label className="block text-k-gray font-bold mb-2">備註</label>
                            <input type="text" value={note} onChange={e=>setNote(e.target.value)} placeholder="例：秘魯藝妓生豆 5kg" className="w-full p-4 border-2 border-gray-300 rounded-xl text-lg bg-k-light" />
                        </div>

                        <button onClick={handleSubmit} className="w-full bg-red-500 hover:bg-red-600 text-white py-4 rounded-xl text-2xl font-bold shadow-lg transition-transform transform hover:scale-105 mt-8">
                            記錄支出
                        </button>
                    </div>
                );
            };

            const BackendBackup = () => {
                const handleExport = () => {
                    const data = { transactions, customers, expenses, exportDate: new Date().toISOString() };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `KAFFA_SIGUAN_Backup_${new Date().getTime()}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast("備份檔下載完成！");
                };

                const handleImport = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (!data.customers || !data.transactions) throw new Error("無效的備份檔");
                            
                            const { db, appId, doc, setDoc, writeBatch, collection } = fb;
                            const batch = writeBatch(db);
                            
                            // To prevent massive loops crashing single session, we'll write one by one or chunk batch
                            // Simplified for this Immersive environment: write sequentially to ensure stability
                            
                            showToast("開始還原資料，請稍候...");
                            
                            for (const c of data.customers) {
                                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'customers', c.id), c);
                            }
                            for (const t of data.transactions) {
                                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'transactions', t.id), t);
                            }
                            if(data.expenses) {
                                for (const ex of data.expenses) {
                                    await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'expenses', ex.id), ex);
                                }
                            }
                            showToast("資料還原成功！(請重新整理頁面確保狀態更新)");
                            setTimeout(() => window.location.reload(), 2000);
                        } catch (err) {
                            console.error(err);
                            showToast("匯入失敗，檔案格式錯誤！", "error");
                        }
                    };
                    reader.readAsText(file);
                };

                return (
                    <div className="flex flex-col items-center justify-center h-full space-y-12">
                        <div className="text-center space-y-4">
                            <div className="w-24 h-24 bg-k-gold text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl">
                                <Icon name="download" className="w-12 h-12" />
                            </div>
                            <h2 className="text-3xl font-bold text-k-gray">系統資料備份與還原</h2>
                            <p className="text-gray-500">永久保留與移轉您的所有消費與會員紀錄</p>
                        </div>

                        <div className="flex gap-8 w-full max-w-2xl">
                            <div className="flex-1 bg-k-light p-8 rounded-2xl border-2 border-k-mint border-dashed text-center hover:bg-white transition-colors">
                                <h3 className="text-xl font-bold text-k-mint-dark mb-4">匯出資料備份檔 (.json)</h3>
                                <p className="text-sm text-gray-500 mb-6">將目前雲端所有資料打包下載至您的電腦中妥善保存。</p>
                                <button onClick={handleExport} className="bg-k-mint text-white px-8 py-3 rounded-xl font-bold text-lg hover:bg-k-mint-dark shadow w-full">
                                    立即下載備份
                                </button>
                            </div>

                            <div className="flex-1 bg-k-light p-8 rounded-2xl border-2 border-k-gold border-dashed text-center hover:bg-white transition-colors relative">
                                <h3 className="text-xl font-bold text-yellow-600 mb-4">匯入備份檔案還原</h3>
                                <p className="text-sm text-gray-500 mb-6">選取您之前下載的 .json 檔案，覆蓋並還原系統狀態。</p>
                                <label className="bg-k-gold text-white px-8 py-3 rounded-xl font-bold text-lg hover:bg-yellow-600 shadow w-full block cursor-pointer">
                                    選擇檔案上傳
                                    <input type="file" accept=".json" className="hidden" onChange={handleImport} />
                                </label>
                            </div>
                        </div>
                    </div>
                );
            };

            // Main Render
            return (
                <div className="flex h-screen w-full bg-k-light font-sans text-gray-800">
                    <Sidebar />
                    <div className="flex-1 flex flex-col min-w-0">
                        <Header />
                        {activeMenu === 'entry' && <EntryArea />}
                        {activeMenu === 'backend' && <BackendArea />}
                        {(activeMenu === 'history' || activeMenu === 'items') && (
                            <div className="flex-1 flex items-center justify-center text-gray-400 text-2xl font-bold bg-white m-6 rounded-2xl border border-gray-200">
                                <Icon name={activeMenu === 'history' ? 'search' : 'coffee'} className="w-12 h-12 mr-4 text-k-mint" />
                                模組開發中，請先使用「登錄消費」與「管理後台」
                            </div>
                        )}
                    </div>
                    {toast && <Toast message={toast} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
