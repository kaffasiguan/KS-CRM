                                                            <span class="inline-flex items-center gap-1 text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md text-xs font-bold">
                                                                <i class="fa-solid fa-circle-check"></i> 已撥款
                                                            </span>
                                                        ) : (
                                                            <span class="inline-flex items-center gap-1 text-rose-500 bg-rose-50 px-2 py-1 rounded-md text-xs font-bold">
                                                                <i class="fa-solid fa-hourglass-start"></i> 待入帳
                                                            </span>
                                                        )}
                                                    </td>
                                                </tr>
                                            ))
                                        ) : (
                                            <tr>
                                                <td colSpan="6" class="p-8 text-center text-slate-400">
                                                    目前尚無 Line Pay 消費紀錄
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* 子板塊四：日常記帳 (主要支出採購開銷登錄) */}
                    {adminTab === 'accounting' && (
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                            
                            {/* 支出輸入表單 */}
                            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 space-y-5 lg:col-span-1">
                                <h3 class="text-lg font-bold text-slate-800 pb-3 border-b border-slate-100 flex items-center gap-1.5">
                                    <i class="fa-solid fa-wallet text-gold-500"></i>
                                    登錄店務支出
                                </h3>

                                <form onSubmit={handleAddExpense} class="space-y-4">
                                    {/* 支出日期 */}
                                    <div class="space-y-1.5 relative">
                                        <label class="block text-xs font-bold text-slate-500 uppercase">交易日期</label>
                                        <input 
                                            type="date"
                                            required
                                            value={expDate}
                                            onChange={(e) => setExpDate(e.target.value)}
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-mint-500 bg-slate-50 font-mono"
                                        />
                                    </div>

                                    {/* 費用類別（全按鈕、無下拉選單） */}
                                    <div class="space-y-2">
                                        <label class="block text-xs font-bold text-slate-500 uppercase">{t('exp_category')}</label>
                                        <div class="grid grid-cols-2 gap-2">
                                            {['採購登錄', '水電費', '租金', '其他費用'].map((cat) => {
                                                const catLabels = { '採購登錄': t('purchase'), '水電費': t('utilities'), '租金': t('rent'), '其他費用': t('others') };
                                                return (
                                                    <button
                                                        key={cat}
                                                        type="button"
                                                        onClick={() => setExpCategory(cat)}
                                                        class={`py-2 px-3 rounded-xl text-xs font-bold transition-all border ${
                                                            expCategory === cat 
                                                            ? 'bg-mint-500 border-mint-500 text-white shadow-sm' 
                                                            : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                                                        }`}
                                                    >
                                                        {catLabels[cat] || cat}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* 費用金額 */}
                                    <div class="space-y-1.5">
                                        <label class="block text-xs font-bold text-slate-500 uppercase">{t('exp_amount')} ($)</label>
                                        <input 
                                            type="number"
                                            required
                                            value={expAmount}
                                            onChange={(e) => setExpAmount(e.target.value)}
                                            placeholder="請輸入台幣金額"
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-mint-500 bg-slate-50 font-mono"
                                        />
                                    </div>

                                    {/* 備註說明 */}
                                    <div class="space-y-1.5">
                                        <label class="block text-xs font-bold text-slate-500 uppercase">{t('exp_memo')}</label>
                                        <input 
                                            type="text"
                                            value={expMemo}
                                            onChange={(e) => setExpMemo(e.target.value)}
                                            placeholder="採購明細或費用說明"
                                            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-mint-500 bg-slate-50"
                                        />
                                    </div>

                                    <button 
                                        type="submit"
                                        class="w-full bg-irongray-800 hover:bg-irongray-900 text-white font-bold py-3.5 rounded-xl transition-all shadow-md mt-2"
                                    >
                                        確定登錄記帳
                                    </button>
                                </form>
                            </div>

                            {/* 支出歷史帳本清單 */}
                            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 lg:col-span-2 space-y-4">
                                <h3 class="text-lg font-bold text-slate-800 pb-3 border-b border-slate-100">
                                    日常支出帳本紀錄 (最新～最舊)
                                </h3>

                                <div class="overflow-x-auto rounded-xl border border-slate-100 max-h-[400px] overflow-y-auto">
                                    <table class="w-full text-left border-collapse text-sm">
                                        <thead>
                                            <tr class="bg-slate-100 text-slate-700 text-xs">
                                                <th class="p-3">日期</th>
                                                <th class="p-3">項目</th>
                                                <th class="p-3">備註</th>
                                                <th class="p-3 text-right">支出金額</th>
                                                <th class="p-3 text-center">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-100">
                                            {expenses.length > 0 ? (
                                                expenses.map(exp => (
                                                    <tr key={exp.id} class="hover:bg-slate-50 text-xs md:text-sm">
                                                        <td class="p-3 font-mono text-slate-500">{exp.date}</td>
                                                        <td class="p-3 font-bold text-slate-800">{exp.category}</td>
                                                        <td class="p-3 text-slate-500">{exp.memo || '無'}</td>
                                                        <td class="p-3 text-right font-bold text-rose-600 font-mono">${exp.amount}</td>
                                                        <td class="p-3 text-center">
                                                            <button 
                                                                onClick={() => setExpenses(expenses.filter(e => e.id !== exp.id))}
                                                                class="text-slate-400 hover:text-rose-500 p-1 rounded-lg"
                                                            >
                                                                <i class="fa-solid fa-trash-can"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr>
                                                    <td colSpan="5" class="p-6 text-center text-slate-400">
                                                        目前尚無開支登錄紀錄
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 渲染啟動
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
